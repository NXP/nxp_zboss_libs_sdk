# Zigbee Zboss Application

# OS
CONFIG_EVENTS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=6144
# Must be higher that MAC_INTF_CB_TASK_PRIORITY, refer to:
# modules/hal/nxp/mcux/middleware/mcux-sdk-middleware-ieee_802.15.4/ieee_802_15_4/mac/source/App/mac_intf_rpmsg.c
CONFIG_MAIN_THREAD_PRIORITY=5

# Flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_NVS=y
#CONFIG_LOG=y
#CONFIG_NVS_LOG_LEVEL_DBG=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_REBOOT=y
CONFIG_ASSERT=y

CONFIG_NXP_RF_IMU=y
CONFIG_NXP_IEEE802154_MAC=y

CONFIG_DEBUG=y

CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Zigbee Zboss Extra options for OTA using MCUBoot

# Flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# MCUboot and OTA support
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="./bootloader/mcuboot/root-rsa-2048.pem"
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# NXP ROM boot support
CONFIG_NXPBOOT_HYBRID_MCUBOOT=y
CONFIG_NXPBOOT_IMG_MANAGER=y

# Set external flash to use smaller logical sectors. Default is set to 65536 (64KB).
# This is mandatory for MCUboot's SWAP_USING_OFFSET mode
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=8192
